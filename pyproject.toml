requires-python = ">=3.12,<3.13"
dependencies = [
    "rl-mind",
    "pystk2-gymnasium",
    "scipy",
    "ipykernel",
    "tqdm",
    # imported by the team2 expert from pystk_project
    "omegaconf",
    "pyyaml",
    "pandas",
    "matplotlib",
    "plotly",
    "pytz",
    "requests",
    "pyparsing",
]

[tool.uv]
package = false
